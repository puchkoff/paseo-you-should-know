<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ff"/>
      <stop offset="0.55" stop-color="#f3f6ff"/>
      <stop offset="1" stop-color="#fff6ec"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdba74" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fdba74" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#312e81" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#b45309" flood-opacity="0.18"/>
    </filter>
    <symbol id="sparkles" viewBox="0 0 24 24">
      <path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9z"/>
      <path d="M19 15l.9 2.1 2.1.9-2.1.9L19 21l-.9-2.1-2.1-.9 2.1-.9z"/>
    </symbol>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1060" cy="120" r="300" fill="url(#glowA)"/>
  <circle cx="880" cy="600" r="260" fill="url(#glowB)"/>
  <circle cx="90" cy="610" r="200" fill="url(#glowA)" opacity="0.6"/>

  <!-- Left: pitch -->
  <g transform="translate(80 150)">
    <rect x="0" y="0" width="196" height="36" rx="18" fill="#ede9fe"/>
    <use href="#sparkles" x="14" y="8" width="20" height="20" fill="#7c3aed"/>
    <text x="42" y="24" font-size="16" font-weight="600" fill="#6d28d9">Paseo plugin</text>

    <text x="0" y="104" font-size="64" font-weight="800" fill="#1e1b4b" letter-spacing="-1.5">You should</text>
    <text x="0" y="176" font-size="64" font-weight="800" fill="url(#brand)" letter-spacing="-1.5">know</text>

    <text x="0" y="232" font-size="24" fill="#4338ca" opacity="0.85">A second pair of eyes on every agent turn.</text>

    <g font-size="19" fill="#3f3f6e">
      <circle cx="9" cy="281" r="5" fill="#f59e0b"/>
      <text x="26" y="288">Claimed done, but a test failed</text>
      <circle cx="9" cy="319" r="5" fill="#f59e0b"/>
      <text x="26" y="326">Committed, never pushed</text>
      <circle cx="9" cy="357" r="5" fill="#f59e0b"/>
      <text x="26" y="364">Part of the request quietly skipped</text>
    </g>
  </g>

  <!-- Right: mock chat -->
  <g transform="translate(680 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="520" height="508" rx="28" fill="#ffffff"/>
  </g>
  <g transform="translate(680 70)">
    <!-- header -->
    <circle cx="36" cy="38" r="6" fill="#fca5a5"/>
    <circle cx="56" cy="38" r="6" fill="#fde68a"/>
    <circle cx="76" cy="38" r="6" fill="#a7f3d0"/>
    <text x="260" y="44" font-size="15" font-weight="600" fill="#6b7280" text-anchor="middle">agent · main</text>
    <line x1="0" y1="68" x2="520" y2="68" stroke="#eef0f6"/>

    <!-- user bubble -->
    <rect x="236" y="92" width="256" height="44" rx="16" fill="#4f46e5"/>
    <text x="256" y="120" font-size="16" fill="#ffffff">Add slugify, test it, commit.</text>

    <!-- agent reply -->
    <g transform="translate(28 160)">
      <circle cx="14" cy="14" r="14" fill="#1e1b4b"/>
      <use href="#sparkles" x="5" y="5" width="18" height="18" fill="#ffffff"/>
      <text x="40" y="20" font-size="17" fill="#111827">Done. <tspan fill="#059669" font-weight="700">✓</tspan> slugify added, committed</text>
      <text x="40" y="46" font-size="17" fill="#111827">and pushed to main.</text>
      <rect x="40" y="62" width="200" height="10" rx="5" fill="#eef0f6"/>
      <rect x="40" y="80" width="150" height="10" rx="5" fill="#eef0f6"/>
    </g>

    <!-- note: plain text under the reply, no box -->
    <g transform="translate(28 286)">
      <text x="40" y="18" font-size="17" fill="#111827">Things you should know:</text>
      <text x="48" y="50" font-size="16" fill="#111827">• <tspan font-weight="700">Failing test:</tspan> test_result_fits_in_n still</text>
      <text x="62" y="74" font-size="16" fill="#111827">fails. The reply skips it.</text>
      <text x="48" y="104" font-size="16" fill="#111827">• <tspan font-weight="700">Pushed to main:</tspan> revert or fix first.</text>
      <text x="62" y="138" font-size="13" fill="#6b7280" text-decoration="underline">Send to agent</text>
      <text x="166" y="138" font-size="13" fill="#6b7280" text-decoration="underline">Dismiss</text>
    </g>

    <!-- composer -->
    <rect x="28" y="448" width="464" height="40" rx="20" fill="#f6f7fb" stroke="#e5e7f0"/>
    <text x="50" y="474" font-size="15" fill="#9ca3af">Message…</text>
    <rect x="410" y="455" width="68" height="26" rx="13" fill="#ede9fe"/>
    <use href="#sparkles" x="420" y="459" width="18" height="18" fill="#7c3aed"/>
    <text x="458" y="473" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">1</text>
  </g>
</svg>
